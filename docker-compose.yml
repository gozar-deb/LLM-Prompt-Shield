services:
  prompt-shield:
    build:
      context: .
      args:
        INSTALL_ML: "0"   # set to "1" to bake in onnxruntime/transformers
    image: llm-prompt-shield:latest
    container_name: llm-prompt-shield
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount your exported ONNX model + tokenizer so it survives rebuilds.
      - ./app/models:/srv/app/app/models:ro
      - ./logs:/srv/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: a local Ollama instance to route to instead of a cloud
  # provider. Start with: docker compose --profile local-llm up
  # then set UPSTREAM_PROVIDER=openai_compatible and
  # UPSTREAM_BASE_URL=http://ollama:11434 in your .env.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
